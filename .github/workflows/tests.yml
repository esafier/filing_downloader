# Runs the test suite on every push and pull request so a PR shows a
# green check (or a red one) before it is merged.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows because that is where the tool runs; Ubuntu as a cheap
        # second opinion on path handling.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
